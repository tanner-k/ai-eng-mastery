[project]
name = "ai-eng-mastery"
version = "0.1.0"
description = "Build-it-yourself AI Engineering curriculum in PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Discover tests anywhere in the repo so new section exemplars are picked up
# automatically (pytest skips .venv/.git via default norecursedirs).
testpaths = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Notebooks legitimately need path/setup code before imports (E402), and use
# single-letter math names (I for identity, etc.) that trip E741.
"*.ipynb" = ["E402", "E741"]
